name: Live appointment-form test

# Run by hand after a deploy: submits ONE clearly marked test request through the real form on the live site
# and checks the page reports success only because Netlify accepted it. Delete the test entry in Netlify afterwards.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test
        default: https://astoustyle.com

permissions:
  contents: write

jobs:
  live-form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir -p ci
          npm install --no-save --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          set -o pipefail
          BASE_URL="${{ inputs.url }}" node scripts/live-form-test.mjs 2>&1 | tee ci/live-form.log
      - name: Publish result
        if: always()
        run: |
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > ci/00-run.txt
          cd ci && git init -q && git config user.name astou-ci && git config user.email astou-ci@users.noreply.github.com
          git checkout -q -b ci-live-form && git add -A && git commit -q -m "Live form test" 
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-live-form
