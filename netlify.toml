[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # "demo"    = the request form validates and offers to send the request by email (nothing is stored).
  # "netlify" = requests are submitted to Netlify Forms; turn on email notifications to Astou in Netlify.
  VITE_FORMS_MODE = "demo"

# Pre-launch: keep the site out of search engines until Astou approves the content.
# At launch: delete this block AND the robots meta tag in index.html, and update public/robots.txt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
